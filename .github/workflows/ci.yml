name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/version.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7
  installers:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: macos
            runner: macos-15
            target: universal-apple-darwin
            bundles: dmg
          - platform: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      VITE_MARKET_URL: https://jupiterben.github.io/xtools-market/
      XTOOLS_MARKET_URL: https://jupiterben.github.io/xtools-market/
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2t64 rpm xdg-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tools
      - name: Check local one-click installer prerequisites
        if: matrix.platform == 'windows'
        run: pnpm desktop:install -CheckOnly
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build platform installers
        run: pnpm --filter @xtools/desktop tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect and verify expected packages
        run: node scripts/release/collect.mjs ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
